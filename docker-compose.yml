services:
  split-uai:
    # Buildada e publicada pelo workflow .github/workflows/docker-publish.yml
    # a cada push na main — o Komodo só puxa a imagem pronta.
    image: ghcr.io/vassopoli/split-uai-frontend:latest
    container_name: split-uai
    restart: unless-stopped
    ports:
      - "${PORT:-8081}:80"

  backend:
    # Buildada e publicada pelo workflow do repo split-uai-backend — o
    # Komodo só puxa a imagem pronta. Evita depender de clone Git (SSH na
    # porta 22) durante o deploy, que ficava bloqueado no host do Komodo.
    image: ghcr.io/vassopoli/split-uai-backend:latest
    container_name: split-uai-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      # MariaDB roda fora do Docker (Synology na LAN) — só aponta pra lá.
      DB_DSN: ${DB_DSN}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      # Lembrete mensal de saldo em aberto via Telegram — opcional, ausente
      # desativa o job (ver internal/reminder no backend).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      REMINDER_DAY_OF_MONTH: ${REMINDER_DAY_OF_MONTH:-30}
      APP_URL: ${APP_URL:-}
      # Web Push (ver "Notificações push" em docs/backend-api-contract.md).
      # A chave pública é a mesma embutida no build do frontend
      # (VITE_VAPID_PUBLIC_KEY no workflow) — ausente aqui desativa o envio.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@split-uai.app}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
