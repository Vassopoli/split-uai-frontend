services:
  split-uai:
    # Buildada e publicada pelo workflow .github/workflows/docker-publish.yml
    # a cada push na main — o Komodo só puxa a imagem pronta.
    image: ghcr.io/vassopoli/split-uai-frontend:latest
    container_name: split-uai
    restart: unless-stopped
    ports:
      - "${PORT:-8081}:80"

  backend:
    # Buildada e publicada pelo workflow do repo split-uai-backend — o
    # Komodo só puxa a imagem pronta. Evita depender de clone Git (SSH na
    # porta 22) durante o deploy, que ficava bloqueado no host do Komodo.
    image: ghcr.io/vassopoli/split-uai-backend:latest
    container_name: split-uai-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      # MariaDB roda fora do Docker (Synology na LAN) — só aponta pra lá.
      DB_DSN: ${DB_DSN}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Segunda tentativa de scan de nota fiscal quando GEMINI_MODEL falha —
      # opcional, ausente usa o mesmo modelo de GEMINI_MODEL (ver
      # internal/receiptscan no backend).
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-}
      # Lembrete mensal de saldo em aberto via Telegram — opcional, ausente
      # desativa o job (ver internal/reminder no backend).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Relatório de cada scan de nota fiscal (grátis bastou / precisou do
      # fallback / falhou) pro chat de análise do operador — opcional,
      # ausente desativa o relatório (ver internal/receiptscan.Reporter).
      TELEGRAM_ANALYTICS_CHAT_ID: ${TELEGRAM_ANALYTICS_CHAT_ID:-}
      REMINDER_DAY_OF_MONTH: ${REMINDER_DAY_OF_MONTH:-30}
      APP_URL: ${APP_URL:-}
      # Web Push (ver "Notificações push" em
      # ../split-uai-docs/frontend/backend-api-contract.md, fora deste repo).
      # A chave pública é a mesma embutida no build do frontend
      # (VITE_VAPID_PUBLIC_KEY no workflow) — ausente aqui desativa o envio.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@split-uai.app}
      # Troca só o categorizador de despesas pra um Ollama local — opcional,
      # ausente mantém Gemini (ver internal/categorize no backend). Se o
      # Ollama rodar no host (fora deste compose), usar
      # http://host.docker.internal:11434 — depende do extra_hosts abaixo
      # pra resolver em host Linux.
      CATEGORIZE_OLLAMA_URL: ${CATEGORIZE_OLLAMA_URL:-}
      CATEGORIZE_OLLAMA_MODEL: ${CATEGORIZE_OLLAMA_MODEL:-llama3.1:8b}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    # host.docker.internal não resolve por padrão em host Linux (diferente de
    # Docker Desktop no Mac/Windows) — precisa disso pro backend alcançar um
    # Ollama rodando fora deste compose, no host do Komodo.
    extra_hosts:
      - "host.docker.internal:host-gateway"
